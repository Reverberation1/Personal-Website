# Runs the minitest suite. Deliberately separate from jekyll.yml: that workflow
# carries two settings the live site depends on (--baseurl "" and the
# Gemfile.lock Bundler pin), and it should not be edited to add a test step.
#
# One toolchain. The tests drive Jekyll through its Ruby API, so the same
# `bundle install` that builds the site also runs the suite.
name: Tests

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  minitest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          # Kept in step with .github/workflows/jekyll.yml. The two are
          # duplicated rather than shared, so a change to the deploy workflow
          # cannot break it. If you bump the version there, bump it here too.
          ruby-version: "3.3"
          # Lockfile is Bundler 4 (see Gemfile.lock BUNDLED WITH); default
          # Bundler 2 breaks bundle install on CI.
          bundler: "Gemfile.lock"
          bundler-cache: true

      - name: Run tests
        run: bundle exec rake test
