# Runs the pytest suite. Deliberately separate from jekyll.yml: that workflow
# carries two settings the live site depends on (--baseurl "" and the
# Gemfile.lock Bundler pin), and it should not be edited to add a test step.
#
# This is not a light Python job. The tests shell out to `bundle exec jekyll
# build`, so the Ruby toolchain must be installed and the gems cached before
# pytest can do anything.
name: Tests

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          # Kept in step with .github/workflows/jekyll.yml. The two are
          # duplicated rather than shared, so that a change to the deploy
          # workflow cannot break it. If you bump the version there, bump it
          # here as well.
          ruby-version: "3.3"
          # Lockfile is Bundler 4 (see Gemfile.lock BUNDLED WITH); default
          # Bundler 2 breaks bundle install on CI.
          bundler: "Gemfile.lock"
          bundler-cache: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          # Pinned, not "latest": a runner upgrade must never change what the
          # suite runs against without a commit saying so.
          python-version: "3.12"

      - name: Install pytest
        run: pip install pytest

      - name: Run tests
        run: python -m pytest
