# Site Configuration
title: Personal Website
description: A minimal personal website
author: Your Name
email: your.email@example.com

# GitHub Pages — project site: https://Reverberation1.github.io/Personal-Website/
url: "https://Reverberation1.github.io"
baseurl: "/Personal-Website"

# Build Settings
markdown: kramdown
highlighter: rouge
plugins:
  - jekyll-sass-converter

# Sass Configuration
sass:
  style: compressed
  sass_dir: _sass

# Collections
collections:
  pages:
    output: true
    permalink: /:name/

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - .git
  - .gitignore
  - README.md
