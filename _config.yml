# Site Configuration
title: Personal Website
description: A minimal personal website
author: Kester Stefan
email: contact@kester.email

url: "https://kester.world"
baseurl: ""

# Build Settings
markdown: kramdown
highlighter: rouge
plugins:
  - jekyll-sass-converter
  - jekyll-redirect-from

# Sass Configuration
sass:
  style: compressed
  sass_dir: _sass

# Collections
collections:
  pages:
    output: true
    permalink: /:name/
  log:
    output: true
    permalink: /log/:name/
  essays:
    output: true
    permalink: /essays/:name/

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - .git
  - .gitignore
  - README.md
  - features
  - tests
  - Rakefile
