# Site Configuration
title: Personal Website
description: A minimal personal website
author: Your Name
email: your.email@example.com

# URL Configuration — set these for GitHub Pages
# User/org site (repo named username.github.io): url below, baseurl: ""
# Project site (e.g. username.github.io/repo/): url + baseurl: "/repo-name"
url: "" # e.g. "https://yourusername.github.io"
baseurl: "" # e.g. "/repo-name" for project pages only

# Build Settings
markdown: kramdown
highlighter: rouge
plugins:
  - jekyll-sass-converter

# Sass Configuration
sass:
  style: compressed
  sass_dir: _sass

# Collections
collections:
  pages:
    output: true
    permalink: /:name/

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - .git
  - .gitignore
  - README.md
