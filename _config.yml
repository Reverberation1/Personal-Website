# Site Configuration
title: Personal Website
description: A minimal personal website
author: Kester Stefan
email: contact@kester.email

url: "kester.world"
baseurl: ""

# Build Settings
markdown: kramdown
highlighter: rouge
plugins:
  - jekyll-sass-converter

# Sass Configuration
sass:
  style: compressed
  sass_dir: _sass

# Collections
collections:
  pages:
    output: true
    permalink: /:name/

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - .git
  - .gitignore
  - README.md
